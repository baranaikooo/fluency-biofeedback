<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#111d40"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pozadie aplikácie -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="#2a3c6d" stroke-width="6"/>

  <!-- Vonkajšie akustické vlny (Akustická rezonancia / DAF biofeedback) -->
  <circle cx="256" cy="240" r="176" fill="none" stroke="rgba(56, 189, 248, 0.18)" stroke-width="4" stroke-dasharray="10 10"/>
  <circle cx="256" cy="240" r="148" fill="none" stroke="rgba(52, 211, 153, 0.28)" stroke-width="5"/>
  <circle cx="256" cy="240" r="120" fill="rgba(28, 42, 79, 0.6)" stroke="url(#cyanGrad)" stroke-width="4" filter="url(#glow)"/>

  <!-- Centrály symbol: Štúdiový mikrofón a hlasivkový rezonančný impulz -->
  <!-- Kapsula mikrofónu -->
  <rect x="224" y="150" width="64" height="110" rx="32" fill="url(#micGrad)" stroke="#1e293b" stroke-width="4"/>
  <!-- Mriežka mikrofónu -->
  <line x1="234" y1="185" x2="278" y2="185" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="234" y1="205" x2="278" y2="205" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <line x1="238" y1="225" x2="274" y2="225" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

  <!-- Oblúk držiaka mikrofónu -->
  <path d="M 206 220 C 206 290, 306 290, 306 220" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
  <!-- Stojan mikrofónu -->
  <line x1="256" y1="275" x2="256" y2="330" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
  <line x1="210" y1="330" x2="302" y2="330" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Dynamické biofeedback spektrálne vlny na spodku -->
  <path d="M 120 400 Q 188 360 256 400 T 392 400" fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round"/>
  <path d="M 150 430 Q 203 400 256 430 T 362 430" fill="none" stroke="url(#emeraldGrad)" stroke-width="7" stroke-linecap="round"/>
</svg>