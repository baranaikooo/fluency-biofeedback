name: Build Glide Native Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['downloads/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: glide-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Build Glide Android Update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build and synchronize current web source
        run: |
          npm ci
          npx --yes pnpm@10.34.3 --dir web install --frozen-lockfile
          npx --yes pnpm@10.34.3 --dir web build
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Restore stable app signing key
        env:
          KEYSTORE: ${{ secrets.GLIDE_SIGNING_KEYSTORE }}
          PASSWORD: ${{ secrets.GLIDE_SIGNING_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$PASSWORD"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/glide-signing.p12"
          chmod 600 "$RUNNER_TEMP/glide-signing.p12"
      - name: Build versioned APK
        env:
          GLIDE_SIGNING_STORE: ${{ runner.temp }}/glide-signing.p12
          GLIDE_SIGNING_PASSWORD: ${{ secrets.GLIDE_SIGNING_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --stacktrace -PglideVersionCode=$((100 + GITHUB_RUN_NUMBER)) -PglideVersionName="1.0.$GITHUB_RUN_NUMBER"
          cp app/build/outputs/apk/debug/app-debug.apk ../glide-native.apk
      - uses: actions/upload-artifact@v4
        with:
          name: glide-native-apk
          path: glide-native.apk
          retention-days: 30
      - name: Publish installable update
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Glide 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Nová verzia Glide. Aplikácia ju ponúkne pri otvorení.
            Stiahni glide-native.apk a potvrď aktualizáciu v Androide.
          files: glide-native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/glide-signing.p12"
