    <title>Glide – Tvoj hlas, tvoje tempo</title>
    
    <style>
      .app-loading-screen{position:fixed;inset:0;z-index:50000;display:grid;place-content:center;justify-items:center;gap:20px;background:#f8f6f0;color:#252341;font-family:system-ui,sans-serif;text-align:center;padding:24px}
      .app-loading-screen svg{width:100px;height:100px;overflow:visible}
      .app-loading-screen .loading-wave{transform-origin:center;transform-box:fill-box;animation:glide-wave 1.2s ease-in-out infinite}
      .app-loading-screen .loading-wave:nth-child(2){animation-delay:.14s}
      .app-loading-screen .loading-wave:nth-child(3){animation-delay:.28s}
      .app-loading-screen strong{font-family:Georgia,serif;font-size:42px;font-weight:500;letter-spacing:-2px}
      .app-loading-screen p{margin:0;font-size:14px;color:#77748b}
      .startup-retry{visibility:hidden;animation:glide-retry 0s 12s forwards;background:#ebe7fb;color:#4a3baa;border:0;border-radius:10px;padding:12px 20px;font:inherit;cursor:pointer}
      @keyframes glide-wave{0%,100%{transform:scaleY(.7);opacity:.65}50%{transform:scaleY(1);opacity:1}}
      @keyframes glide-retry{to{visibility:visible}}
      @media(prefers-reduced-motion:reduce){.app-loading-screen .loading-wave{animation:none}}
    </style>
    <meta name="description" content="Tvoj osobný priestor pre tréning reči, biofeedback a vlastné tempo.">
