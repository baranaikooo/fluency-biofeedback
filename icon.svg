<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111d40"/>
      <stop offset="100%" stop-color="#0b132b"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58cc02"/>
      <stop offset="100%" stop-color="#89e219"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="108" fill="none" stroke="#2a3c6d" stroke-width="8"/>

  <!-- Outer acoustic pulse rings -->
  <circle cx="256" cy="240" r="170" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="240" r="140" fill="#1c2a4f" stroke="url(#cyanGrad)" stroke-width="8" filter="url(#glow)"/>

  <!-- Owl Head Profile -->
  <circle cx="200" cy="220" r="46" fill="#0b132b" stroke="url(#neonGreen)" stroke-width="8"/>
  <circle cx="312" cy="220" r="46" fill="#0b132b" stroke="url(#neonGreen)" stroke-width="8"/>
  
  <circle cx="200" cy="220" r="22" fill="#58cc02"/>
  <circle cx="312" cy="220" r="22" fill="#58cc02"/>

  <circle cx="208" cy="214" r="8" fill="#ffffff"/>
  <circle cx="320" cy="214" r="8" fill="#ffffff"/>

  <!-- Owl Beak -->
  <polygon points="256,252 238,288 274,288" fill="#ff9600"/>

  <!-- Sound Waves (Fluency) -->
  <path d="M 130 380 Q 256 425 382 380" fill="none" stroke="url(#cyanGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 170 410 Q 256 445 342 410" fill="none" stroke="url(#neonGreen)" stroke-width="8" stroke-linecap="round"/>
</svg>